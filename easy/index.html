<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>임베디드 중간고사, 진짜 쉽게</title>
<style>
:root {
  --bg: #F6F4EF; --card: #FFFFFF; --ink: #1E1E1C; --dim: #6B6A65; --line: #E2DFD8;
  --red: #E8412C; --red-soft: #FDE9E5; --teal: #1F8A8A; --teal-soft: #E1F2F1;
  --yellow: #E9A23B; --yellow-soft: #FCF1DF; --green: #2F7D4F; --green-soft: #E3F1E8;
  --mono: "D2Coding", "SF Mono", Menlo, Consolas, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171816; --card: #22231F; --ink: #ECEAE4; --dim: #9C9A93; --line: #36372F;
    --red-soft: #3A1F1A; --teal-soft: #16302F; --yellow-soft: #352A17; --green-soft: #1B2F22;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.65 "Pretendard Variable", "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  word-break: keep-all;
}
a { color: inherit; }
code, .mono { font-family: var(--mono); font-size: .92em; }
code { background: var(--yellow-soft); padding: 1px 6px; border-radius: 6px; }
button { font: inherit; cursor: pointer; }

header {
  position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
}
.bar { max-width: 860px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 14px; }
.bar .home { font-weight: 800; text-decoration: none; white-space: nowrap; }
.prog { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--green); transition: width .4s; }
.bar small { color: var(--dim); white-space: nowrap; }
.bar .hub { font-size: 14px; color: var(--dim); text-decoration: none; white-space: nowrap; }
.bar .hub:hover { color: var(--ink); }
@media (max-width: 560px) { .bar .hub { display: none; } }

/* 흐름: 요약 → 원래 페이지 → 다음 요약 */
.loop { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 22px; font-size: 15px; }
.loop span { background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; }
.loop span.me { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 700; }
.loop i { color: var(--dim); font-style: normal; }
.cont { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; background: var(--ink); color: var(--bg); border-radius: var(--r); padding: 18px 22px; margin-bottom: 18px; text-decoration: none; }
.cont b { font-size: 20px; }
.cont small { display: block; opacity: .7; }
.cont .go { font-weight: 800; white-space: nowrap; }
.nextstep { border: 2px solid var(--ink); }
.nextstep p { margin: 0 0 14px; }
.nextstep .row { margin: 0; }
.nextstep .btn { text-decoration: none; }
.nextstep .btn.main { font-size: 18px; padding: 10px 18px; }
.back { display: inline-block; margin-top: 14px; color: var(--dim); font-size: 15px; }

main { max-width: 860px; margin: 0 auto; padding: 28px 20px 80px; }
h1 { font-size: clamp(28px, 6vw, 42px); line-height: 1.25; margin: 8px 0 10px; letter-spacing: -.02em; }
h2 { font-size: 22px; margin: 0 0 12px; }
.lede { color: var(--dim); font-size: 18px; margin: 0 0 28px; }

/* 홈 카드 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.ch {
  display: block; text-decoration: none; background: var(--card); border: 2px solid var(--line);
  border-radius: var(--r); padding: 18px; position: relative; transition: transform .15s, border-color .15s;
}
.ch:hover { transform: translateY(-3px); border-color: var(--ink); }
.ch .wk { font-size: 13px; font-weight: 700; color: var(--red); }
.ch b { display: block; font-size: 19px; margin: 2px 0 6px; }
.ch p { margin: 0; color: var(--dim); font-size: 15px; }
.ch.done::after {
  content: "✓ 봤어요"; position: absolute; top: 14px; right: 14px; font-size: 12px; font-weight: 700;
  color: var(--green); background: var(--green-soft); padding: 2px 8px; border-radius: 99px;
}
.ch.special { border-style: dashed; }
.howto { margin-top: 30px; background: var(--card); border-radius: var(--r); padding: 18px 20px; border: 1px solid var(--line); }
.howto ol { margin: 6px 0 0; padding-left: 22px; }

/* 챕터 */
.kicker { font-weight: 700; color: var(--red); font-size: 14px; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 22px; margin: 18px 0; }
.box h2 .n {
  display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
  background: var(--ink); color: var(--bg); font-size: 15px; margin-right: 8px; vertical-align: 2px;
}
.oneline { font-size: clamp(20px, 4vw, 26px); font-weight: 800; line-height: 1.45; margin: 0; }
.why { margin: 12px 0 0; color: var(--dim); }

/* 모르는 말 사전 (접힘) */
.words summary { list-style: none; cursor: pointer; }
.words summary::-webkit-details-marker { display: none; }
.words summary h2 { display: inline; margin: 0; }
.words summary .more { display: block; color: var(--teal); font-size: 15px; font-weight: 700; margin-top: 6px; }
.words[open] summary .more { display: none; }
.words dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 14px 0 0; }
.words dt { font-weight: 800; }
.words dd { margin: 0; color: var(--dim); }
@media (max-width: 560px) { .words dl { grid-template-columns: 1fr; gap: 2px; } .words dd { margin-bottom: 8px; } }

/* 장난감 안내 + 덤(접힘) */
.steps { background: var(--teal-soft); border-radius: 12px; padding: 10px 14px; margin: -4px 0 14px; font-size: 15px; }
.steps .look { display: block; margin-top: 4px; font-weight: 700; }
.extra { margin-top: 20px; border-top: 1px dashed var(--line); padding-top: 12px; }
.extra summary { cursor: pointer; font-weight: 700; color: var(--teal); }
.analogy { background: var(--yellow-soft); border: none; }
.analogy p { margin: 0; }
.points { list-style: none; padding: 0; margin: 0; counter-reset: p; }
.points li { counter-increment: p; position: relative; padding: 10px 0 10px 44px; border-top: 1px dashed var(--line); }
.points li:first-child { border-top: 0; }
.points li::before {
  content: counter(p); position: absolute; left: 0; top: 10px; width: 30px; height: 30px; border-radius: 9px;
  background: var(--teal-soft); color: var(--teal); font-weight: 800; display: grid; place-items: center;
}

/* 장난감 공통 */
.toy { border: 2px solid var(--teal); }
.toy .hint { color: var(--dim); font-size: 15px; margin: -4px 0 14px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 10px 0; }
.btn {
  border: 2px solid var(--ink); background: var(--card); color: var(--ink); border-radius: 10px;
  padding: 7px 14px; font-weight: 700;
}
.btn:hover { background: var(--ink); color: var(--bg); }
.btn.main { background: var(--ink); color: var(--bg); }
.btn.sel { background: var(--teal); border-color: var(--teal); color: #fff; }
input[type=range] { flex: 1; min-width: 160px; accent-color: var(--teal); }
input[type=text] {
  font: 700 20px var(--mono); width: 90px; padding: 6px 10px; border-radius: 10px;
  border: 2px solid var(--line); background: var(--bg); color: var(--ink); text-align: center;
}
.out {
  background: var(--bg); border-radius: 12px; padding: 14px 16px; margin-top: 12px; font-size: 16px;
}
.out .big { font: 800 26px var(--mono); }
.ok { color: var(--green); font-weight: 800; }
.bad { color: var(--red); font-weight: 800; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: var(--line); margin-right: 4px; }

.bits { display: flex; gap: 6px; flex-wrap: wrap; }
.bit {
  width: 46px; text-align: center; border-radius: 10px; border: 2px solid var(--line); background: var(--card);
  padding: 4px 0; user-select: none;
}
.bit small { display: block; font-size: 11px; color: var(--dim); }
.bit b { font: 800 22px var(--mono); }
.bit.on { background: var(--red); border-color: var(--red); color: #fff; }
.bit.on small { color: #ffd9d2; }
.bit.pick { outline: 3px solid var(--teal); outline-offset: 2px; }
.bit.click { cursor: pointer; }

/* UART 파형 */
.wave { display: flex; overflow-x: auto; padding-bottom: 4px; }
.wave div { flex: 0 0 48px; text-align: center; font-size: 12px; }
.wave .ln { height: 44px; position: relative; border-left: 1px dotted var(--line); }
.wave .ln::after { content: ""; position: absolute; left: 0; right: 0; height: 3px; background: var(--teal); }
.wave .hi .ln::after { top: 4px; } .wave .lo .ln::after { bottom: 4px; }
.wave .st .ln::after, .wave .sp .ln::after { background: var(--red); }
.wave .v { font: 800 18px var(--mono); }

/* GPDO 묶음 */
.cells { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; max-width: 460px; }
.cell { border: 2px solid var(--line); border-radius: 10px; padding: 6px; text-align: center; font-size: 13px; background: var(--card); }
.cell b { display: block; font: 800 16px var(--mono); }
.cell.me { border-color: var(--red); background: var(--red-soft); }
.cell.wrong { border-style: dashed; border-color: var(--dim); }
.led { display: inline-block; width: 22px; height: 22px; border-radius: 50%; background: #5a2a24; vertical-align: -5px; margin-right: 6px; transition: .2s; }
.led.on { background: var(--red); box-shadow: 0 0 16px 4px var(--red); }

/* 흐름 */
.flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.flow span { padding: 6px 10px; border-radius: 10px; background: var(--bg); border: 2px solid var(--line); font-size: 14px; font-weight: 700; transition: .2s; }
.flow span.lit { background: var(--teal); border-color: var(--teal); color: #fff; transform: scale(1.06); }
.flow i { color: var(--dim); font-style: normal; }

/* 분류 게임 */
.sort { display: grid; gap: 8px; }
.sort .item { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--bg); border-radius: 10px; padding: 8px 12px; flex-wrap: wrap; }
.sort .item .res { font-size: 14px; width: 100%; }

/* LCD */
.lcd { display: inline-block; background: #9DBB3B; color: #1d2a06; font: 700 20px var(--mono); padding: 10px 14px; border-radius: 6px; border: 6px solid #2a5a1a; white-space: pre; line-height: 1.3; }

/* 함정 카드 */
.traps { display: grid; gap: 10px; }
.trap { border: 2px solid var(--line); border-radius: 12px; padding: 14px 16px; background: var(--card); }
.trap .q { font-weight: 700; }
.trap .ans { display: none; margin-top: 8px; font-size: 15px; }
.trap.open .ans { display: block; }
.trap .ox { display: flex; gap: 8px; margin-top: 10px; }
.trap .ox button { width: 54px; height: 40px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); font-weight: 800; font-size: 18px; }
.trap.right { border-color: var(--green); }
.trap.wrong { border-color: var(--red); }

.nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 28px; flex-wrap: wrap; }

/* 숫자 카드 */
.nums { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.num { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 14px; cursor: pointer; min-height: 110px; }
.num .k { font-size: 14px; color: var(--dim); }
.num .v { font: 800 22px var(--mono); margin: 4px 0; visibility: hidden; }
.num .w { font-size: 14px; visibility: hidden; }
.num.open .v, .num.open .w { visibility: visible; }
.num:not(.open) .k::after { content: "  · 눌러서 보기"; color: var(--teal); font-weight: 700; }

/* 퀴즈 */
.quiz { text-align: center; }
.quiz .q { font-size: clamp(20px, 4vw, 26px); font-weight: 800; margin: 20px 0; min-height: 3em; }
.quiz .ox { display: flex; gap: 14px; justify-content: center; }
.quiz .ox button { width: 110px; height: 80px; font-size: 40px; font-weight: 900; border-radius: 18px; border: 3px solid var(--ink); background: var(--card); color: var(--ink); }
.quiz .ox button:hover { background: var(--ink); color: var(--bg); }
.quiz .why { margin: 18px auto 0; max-width: 560px; min-height: 4em; }
.score { font-size: 15px; color: var(--dim); }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="home" href="#/">임베디드 쉽게</a>
    <div class="prog" title="본 챕터 비율"><i id="progBar"></i></div>
    <small id="progTxt">0 / 7</small>
    <a class="hub" href="../index.html">자세히 보는 보드 허브 →</a>
  </div>
</header>
<main id="app"></main>

<script>
/* ---------- 도우미 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const hex = (v, d = 2) => "0x" + (v >>> 0).toString(16).toUpperCase().padStart(d, "0");
const bin = (v, d = 8) => (v >>> 0).toString(2).padStart(d, "0");
const DONE_KEY = "embedded-easy-done";
const done = new Set(JSON.parse(localStorage.getItem(DONE_KEY) || "[]"));
const saveDone = () => localStorage.setItem(DONE_KEY, JSON.stringify([...done]));

/* ---------- 내용 ---------- */
const CH = [
  {
    id: "hint", wk: "교수님 힌트", title: "비트 연산 · 포인터 · volatile",
    card: "레지스터 스위치 하나만 콕 집어서 켜고 끄는 법",
    why: "MCU를 움직이는 건 결국 <b>정해진 주소에 있는 숫자를 바꾸는 일</b>이에요. 그 숫자 중 <b>원하는 한 자리만</b> 바꾸는 기술이 비트 연산이라 2~6주차 코드 전부에 나와요. 시험에도 꼭 나와요.",
    one: "숫자 안의 0/1 한 칸만 골라서 켜고 끄는 법이에요.",
    ana: "전등 스위치 8개가 한 줄로 붙은 판이 있어요. 다른 스위치는 그대로 두고 <b>3번만</b> 켜고 싶을 때 쓰는 방법이 비트 연산이에요.",
    pts: [
      "켜기 <code>|=</code>, 끄기 <code>&= ~</code>, 뒤집기 <code>^=</code>, 확인 <code>&</code>. 늘 <code>(1U &lt;&lt; n)</code>(n번 칸만 1인 숫자)과 같이 써요.",
      "구조체 멤버는 하나에 <b>4바이트</b>씩 뒤로 가요. 3번째면 3 × 4 = 12 = 16진수 <b>0x0C</b>. (0x12라고 쓰면 오답)",
      "하드웨어나 인터럽트가 바꾸는 변수엔 <code>volatile</code>을 붙여요. \"매번 진짜 값을 다시 읽어\"라는 뜻이에요.",
    ],
    words: [
      ["비트", "0 또는 1 한 칸. 8칸이 모이면 1바이트."],
      ["레지스터", "하드웨어를 조종하는 특별한 메모리 칸. 여기에 숫자를 쓰면 하드웨어가 움직여요."],
      ["마스크", "건드릴 칸만 1로 표시한 숫자. <code>1U &lt;&lt; 3</code> = 00001000."],
      ["16진수 (0x)", "숫자를 0~9, A~F로 쓰는 방법. 0x0C = 12, 0x10 = 16."],
      ["포인터", "주소를 담는 변수. 앞에 <code>*</code>를 붙이면 그 주소로 찾아가요."],
      ["volatile", "컴파일러에게 \"이 값은 몰래 바뀔 수 있으니 매번 새로 읽어\"라고 알려 주는 말."],
      ["ISR", "인터럽트가 오면 자동으로 실행되는 함수 (5주차)."],
    ],
    toy: "bits",
    traps: [
      ["<code>1 & 2</code>와 <code>1 && 2</code>의 결과는 같다.", false, "1 & 2는 칸마다 AND라 0, 1 && 2는 \"둘 다 참?\"이라 1이에요."],
      ["구조체 첫 주소가 0x10002000이면 <code>msrstart->v3</code>은 0x10002012다.", false, "3번째 칸 = 3 × 4 = 12바이트 = 16진수 0x0C → 0x1000200C."],
      ["<code>REG & 1U &lt;&lt; n != 0</code>은 괄호 없이 써도 의도대로 동작한다.", false, "!=가 &보다 먼저 계산돼요. 항상 ((REG & (1U &lt;&lt; n)) != 0)처럼 감싸요."],
      ["volatile이 없으면 ISR이 바꾼 flag를 main 루프가 못 알아챌 수 있다.", true, "컴파일러가 flag를 CPU 레지스터에 복사해 두고 그것만 다시 읽기 때문이에요."],
    ],
  },
  {
    id: "w1", wk: "1주차", title: "S32K3 개요와 UART",
    card: "printf 한 줄이 선을 타고 PC 화면까지 가는 길",
    why: "보드에는 화면이 없어서 프로그램이 제대로 도는지 볼 방법이 없어요. 그래서 <b>보드가 PC로 글자를 보내게</b> 만들어요. 이게 되면 printf로 값을 찍어 보며 디버깅할 수 있어요.<br>결과물: PC 터미널(PuTTY)에 글자가 찍혀요.",
    one: "보드가 USB 선을 통해 PC 화면에 글자를 보내게 만들어요.",
    ana: "모스 부호처럼 선 하나로 '높다 / 낮다'를 차례로 보내 글자를 전달해요. 박자를 같이 보내지 않으니 양쪽이 <b>\"1초에 115200칸\"</b>이라고 속도를 미리 약속해요.",
    pts: [
      "준비 순서: <b>클럭(심장 박동) → 핀 → UART → printf</b>. 클럭은 안정될 때까지(PLL Lock) 기다렸다가 써요.",
      "글자 하나 = 시작 1칸 + 데이터 8칸 + 끝 1칸 = <b>10칸</b>. 데이터는 <b>작은 자리(LSB)부터</b> 보내요.",
      "PC와 연결된 건 <b>LPUART6</b> (PTA16 보내기 / PTA15 받기). LPUART0이 아니에요.",
    ],
    words: [
      ["UART", "선 2개(보내기 / 받기)로 글자를 주고받는 가장 단순한 통신."],
      ["baud rate", "1초에 몇 칸 보내는지. 실습 값은 115200."],
      ["클럭", "칩의 심장 박동. 모든 부품이 이 박자에 맞춰 움직여요."],
      ["PLL", "느린 클럭을 빠르게 뻥튀기하는 장치. 안정(Lock)될 때까지 기다려야 해요."],
      ["LSB / MSB", "숫자의 가장 작은 자리 / 가장 큰 자리."],
      ["_write()", "printf가 글자를 내보낼 때 부르는 함수. 이걸 직접 만들어 UART로 보내요."],
      ["PuTTY", "보드가 보낸 글자를 PC에서 보여 주는 프로그램."],
    ],
    toy: "uart",
    traps: [

    const draw = () => {

      const ma = samples.map((_, i) => { const a = samples.slice(Math.max(0, i - N + 1), i + 1); return a.reduce((s, v) => s + v, 0) / a.length; });
      const path = (arr) => arr.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(" ");
      $("#mo", el).innerHTML = `<svg viewBox="0 0 ${W} ${Hh}" style="width:100%;height:auto">
        <path d="${path(samples)}" fill="none" stroke="var(--dim)" stroke-width="1.5" opacity=".6"/>
        <path d="${path(ma)}" fill="none" stroke="var(--red)" stroke-width="3"/>
        <line x1="${x(15)}" x2="${x(15)}" y1="0" y2="${Hh}" stroke="var(--teal)" stroke-dasharray="4 4"/>
        <text x="${x(15) + 4}" y="14" font-size="12" fill="var(--teal)">노브 돌림</text></svg>
        <span style="color:var(--dim)">회색 = 하드웨어 평균값(HW)</span>, <span class="bad">빨강 = 이동 평균(MA)</span>.
        N이 크면 <b>덜 흔들리지만 늦게</b> 따라가요. N이 작으면 빨리 따라가지만 흔들려요.`;
    };
    el.querySelectorAll("[data-b]").forEach((b) => b.onclick = () => {
      res = +b.dataset.b; el.querySelectorAll("[data-b]").forEach((x) => x.classList.toggle("sel", x === b)); draw();
    });
    $("#kn", el).oninput = draw;
    $("#mn", el).oninput = drawMA;
    $("#mr", el).onclick = () => { noisy(); drawMA(); };
    noisy(); draw(); drawMA();
  },
};

/* ---------- 화면 ---------- */
const app = $("#app");

function progress() {
  $("#progBar").style.width = (done.size / CH.length * 100) + "%";
  $("#progTxt").textContent = `${done.size} / ${CH.length}`;
}

function home() {
  app.innerHTML = `
    <h1>임베디드 중간고사,<br>진짜 쉽게</h1>
    <p class="lede">S32K312 수업 1~6주차와 교수님 힌트를 <b>비유 하나 + 핵심 몇 줄 + 직접 만져 보기 + 함정 OX</b>로 정리했어요. 한 챕터 5분이면 충분해요.</p>
    <div class="loop"><span class="me">① 5분 요약</span><i>→</i><span>② 원래 페이지에서 자세히</span><i>→</i><span>③ 다음 주차 요약</span><i>→ … →</i><span>④ 숫자 · OX로 마무리</span></div>
    ${contCard()}
    <div class="grid">
      ${CH.map((c) => `<a class="ch ${done.has(c.id) ? "done" : ""}" href="#/${c.id}">
        <div class="wk">${c.wk}</div><b>${c.title}</b><p>${c.card}</p></a>`).join("")}
      <a class="ch special" href="#/nums"><div class="wk">시험 직전</div><b>꼭 외울 숫자 12개</b><p>카드를 눌러서 맞혀 보기</p></a>
      <a class="ch special" href="#/quiz"><div class="wk">총정리</div><b>함정 OX 랜덤 퀴즈</b><p>모든 주차의 낚시 문제를 섞어서</p></a>
    </div>
    <div class="howto"><b>이렇게 보면 좋아요</b>
      <ol><li>여기서 왜 하는지, 비유, 장난감, 함정 OX로 \"아 그거구나\" 감을 잡고</li><li>챕터 끝 버튼으로 <b>원래 페이지</b>에 넘어가 코드 한 줄씩, 레지스터 비트, 체크 퀴즈까지 보고</li><li>원래 페이지 맨 아래 버튼으로 <b>다음 주차 요약</b>에 돌아와요.</li><li>다 돌면 숫자 12개와 OX 랜덤 퀴즈로 마무리해요.</li></ol>
    </div>`;
}

// 아직 안 본 첫 챕터로 이어서 (처음이면 "시작하기")
function contCard() {
  const c = CH.find((x) => !done.has(x.id));
  if (!c) return `<a class="cont" href="#/quiz"><span><small>요약 7개를 다 봤어요</small><b>함정 OX 랜덤 퀴즈로 마무리</b></span><span class="go">풀기 →</span></a>`;
  return `<a class="cont" href="#/${c.id}"><span><small>${done.size ? "여기부터 이어서" : "처음이면 여기부터"}</small><b>${c.wk} · ${c.title}</b></span><span class="go">${done.size ? "이어서 보기" : "시작하기"} →</span></a>`;
}

function chapter(c) {
  const i = CH.indexOf(c), prev = CH[i - 1], next = CH[i + 1];
  app.innerHTML = `
    <div class="kicker">${c.wk}</div>
    <h1>${c.title}</h1>
    <div class="box"><h2><span class="n">1</span>이번 주에 뭐 해?</h2><p class="oneline">${c.one}</p><p class="why">${c.why}</p></div>
    <div class="box analogy"><h2><span class="n">2</span>비유로</h2><p>${c.ana}</p></div>
    <div class="box"><h2><span class="n">3</span>꼭 기억할 것 3개</h2><ol class="points">${c.pts.map((p) => `<li>${p}</li>`).join("")}</ol></div>
    <details class="box words"><summary><h2><span class="n">4</span>모르는 말 사전</h2><span class="more">위에서 모르는 말이 있으면 열어 보세요</span></summary>
      <dl>${c.words.map(([w, d]) => `<dt>${w}</dt><dd>${d}</dd>`).join("")}</dl></details>
    <div class="box toy"><h2><span class="n">5</span>직접 만져 보기</h2><div id="toy"></div></div>
    <div class="box"><h2><span class="n">6</span>시험 함정 OX</h2><p class="hint" style="color:var(--dim);margin-top:-6px">O인지 X인지 먼저 골라 보세요.</p><div class="traps" id="traps"></div></div>
    <div class="box nextstep"><h2><span class="n">7</span>감 잡았으면, 이제 제대로</h2>
      <p>원래 ${c.wk} 페이지에서 코드를 한 줄씩 따라가고, 레지스터 비트를 눌러 보고, 체크 퀴즈까지 풀어요. 다 보면 그 페이지 맨 아래에서 ${next ? `<b>${next.wk} 요약</b>으로` : "<b>마무리 퀴즈</b>로"} 바로 돌아올 수 있어요.</p>
      <div class="row">
        <a class="btn main mark" href="${deepHref(c)}">원래 ${c.wk} 페이지에서 자세히 →</a>
        <a class="btn mark" href="${next ? `#/${next.id}` : "#/quiz"}">${next ? `요약만 이어서: ${next.wk}` : "OX 퀴즈로"} →</a>
      </div>
    </div>
    ${prev ? `<a class="back" href="#/${prev.id}">← ${prev.wk} 요약</a>` : `<a class="back" href="#/">← 처음으로</a>`}`;
  TOYS[c.toy]($("#toy"));
  for (const [q, a, why] of c.traps) {
    const d = document.createElement("div");
    d.className = "trap";
    d.innerHTML = `<div class="q">${q}</div><div class="ox"><button>O</button><button>X</button></div><div class="ans"></div>`;
    d.querySelectorAll(".ox button").forEach((b) => b.onclick = () => {
      const ok = (b.textContent === "O") === a;
      d.className = "trap open " + (ok ? "right" : "wrong");
      d.querySelector(".ans").innerHTML = `${ok ? '<span class="ok">맞았어요!</span>' : '<span class="bad">낚였어요!</span>'} 정답은 <b>${a ? "O" : "X"}</b>. ${why}`;
    });
    $("#traps").append(d);
  }
  // 어느 쪽으로 넘어가든 이 요약은 본 것으로
  app.querySelectorAll(".mark").forEach((a) => a.addEventListener("click", () => { done.add(c.id); saveDone(); progress(); }));
}

function nums() {
  app.innerHTML = `
    <div class="kicker">시험 직전</div><h1>꼭 외울 숫자 12개</h1>
    <p class="lede">질문만 보고 답을 떠올린 다음 카드를 눌러 확인해요.</p>
    <div class="row"><button class="btn" id="all">전부 열기</button><button class="btn" id="none">전부 닫기</button></div>
    <div class="nums">${NUMS.map(([k, v, w]) => `<div class="num"><div class="k">${k}</div><div class="v">${v}</div><div class="w">${w}</div></div>`).join("")}</div>
    <div class="nav"><a class="btn" href="#/">← 처음으로</a><a class="btn main" href="#/quiz">함정 OX 퀴즈로 →</a></div>`;
  app.querySelectorAll(".num").forEach((n) => n.onclick = () => n.classList.toggle("open"));
  $("#all").onclick = () => app.querySelectorAll(".num").forEach((n) => n.classList.add("open"));
  $("#none").onclick = () => app.querySelectorAll(".num").forEach((n) => n.classList.remove("open"));
}

function quiz() {
  const all = CH.flatMap((c) => c.traps.map(([q, a, why]) => ({ q, a, why, wk: c.wk, id: c.id })));
  for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
  let i = 0, score = 0, answered = false;
  const wrong = [];
  const show = () => {
    if (i >= all.length) {
      app.innerHTML = `<div class="quiz"><h1>끝! ${score} / ${all.length}</h1>
        <p class="lede">${score === all.length ? "완벽해요. 시험장에서도 안 낚일 거예요." : "틀린 문제의 챕터를 다시 한번 보고 와요."}</p>
        ${wrong.length ? `<div class="box" style="text-align:left"><h2>다시 볼 곳</h2>${wrong.map((w) => `<p><b>${w.wk}</b> <a href="#/${w.id}">요약</a> · <a href="../weeks/${DEEP[w.id]}">자세히</a> — ${w.q}<br><small style="color:var(--dim)">정답 ${w.a ? "O" : "X"} — ${w.why}</small></p>`).join("")}</div>` : ""}
        <div class="row" style="justify-content:center"><button class="btn main" id="again">다시 풀기</button>${score < all.length ? "" : `<a class="btn" href="#/nums">숫자 12개 복습</a>`}<a class="btn" href="#/">처음으로</a></div></div>`;
      $("#again").onclick = quiz;
      return;
    }
    const it = all[i]; answered = false;
    app.innerHTML = `<div class="quiz">
      <div class="score">${i + 1} / ${all.length} · 맞힌 개수 ${score} · <span class="tag">${it.wk}</span></div>
      <div class="q">${it.q}</div>
      <div class="ox"><button data-a="1">O</button><button data-a="0">X</button></div>
      <div class="why" id="why"></div></div>`;
    app.querySelectorAll("[data-a]").forEach((b) => b.onclick = () => {
      if (answered) return; answered = true;
      const ok = (b.dataset.a === "1") === it.a;
      if (ok) score++; else wrong.push(it);
      $("#why").innerHTML = `<p>${ok ? '<span class="ok" style="font-size:22px">맞았어요!</span>' : '<span class="bad" style="font-size:22px">낚였어요!</span>'}<br>정답은 <b>${it.a ? "O" : "X"}</b>. ${it.why}</p><button class="btn main" id="nx">다음 →</button>`;
      $("#nx").onclick = () => { i++; show(); };
    });
  };
  show();
}

function route() {
  const id = location.hash.replace(/^#\/?/, "");
  const c = CH.find((x) => x.id === id);
  if (c) chapter(c);
  else if (id === "nums") nums();
  else if (id === "quiz") quiz();
  else home();
  progress();
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
